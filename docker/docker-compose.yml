name: JavaAuction

# 애플리케이션 서비스만 실행하는 docker-compose 파일
# 사용법: docker-compose up -d
# 인프라는 먼저 docker-compose -f docker-compose.infrastructure.yml up -d 로 실행 필요

services:

  # Zipkin
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: javaauction-zipkin
    ports:
      - "9411:9411"
    networks:
      - javaauction-network
    environment:
      STORAGE_TYPE: mem
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9411/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Eureka Server (19090)
  eureka-server:
    build:
      context: ../eureka
      dockerfile: ../docker/Dockerfile
    container_name: eureka-server
    ports:
      - "19090:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
    networks:
      - javaauction-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Gateway (19091)
  gateway:
    build:
      context: ../gateway
      dockerfile: ../docker/Dockerfile
      args:
        - JWT_SECRET=${JWT_SECRET}
    container_name: gateway
    ports:
      - "19091:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8080/eureka
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - javaauction-network
    depends_on:
      eureka-server:
        condition: service_healthy

  # User Service (19092)
  user-service:
    build:
      context: ../user-service
      dockerfile: ../docker/Dockerfile
      args:
        - JWT_SECRET=${JWT_SECRET}
    container_name: user-service
    ports:
      - "19092:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8080/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: javaauction
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - javaauction-network
    depends_on:
      eureka-server:
        condition: service_healthy

  # Product Service (19093)
  product-service:
    build:
      context: ../product-service
      dockerfile: ../docker/Dockerfile
      args:
        - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
        - AWS_SECRET_KEY=${AWS_SECRET_KEY}
    container_name: product-service
    ports:
      - "19093:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8080/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_db
      SPRING_DATASOURCE_USERNAME: javaauction
      SPRING_DATASOURCE_PASSWORD: 1234
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
    networks:
      - javaauction-network
    depends_on:
      eureka-server:
        condition: service_healthy

  # Auction Service (19094)
  auction-service:
    build:
      context: ../auction-service
      dockerfile: ../docker/Dockerfile
    container_name: auction-service
    ports:
      - "19094:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8080/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auction_db
      SPRING_DATASOURCE_USERNAME: javaauction
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - javaauction-network
    depends_on:
      eureka-server:
        condition: service_healthy

  # Payment Service (19095)
  payment-service:
    build:
      context: ../payment-service
      dockerfile: ../docker/Dockerfile
    container_name: payment-service
    ports:
      - "19095:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8080/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: javaauction
      SPRING_DATASOURCE_PASSWORD: 1234
    networks:
      - javaauction-network
    depends_on:
      eureka-server:
        condition: service_healthy

  # Chat Service (19096)
  chat-service:
    build:
      context: ../chat-service
      dockerfile: ../docker/Dockerfile
    container_name: chat-service
    ports:
      - "19096:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8080/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chat_db
      SPRING_DATASOURCE_USERNAME: javaauction
      SPRING_DATASOURCE_PASSWORD: 1234
    networks:
      - javaauction-network
    depends_on:
      eureka-server:
        condition: service_healthy

  # Alert Service (19097)
  alert-service:
    build:
      context: ../alert-service
      dockerfile: ../docker/Dockerfile
      args:
        - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
        - AWS_SECRET_KEY=${AWS_SECRET_KEY}
        - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
    container_name: alert-service
    ports:
      - "19097:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8080/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/alert_db
      SPRING_DATASOURCE_USERNAME: javaauction
      SPRING_DATASOURCE_PASSWORD: 1234
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - javaauction-network
    depends_on:
      eureka-server:
        condition: service_healthy

  # Review Service (19098)
  review-service:
    build:
      context: ../review-service
      dockerfile: ../docker/Dockerfile
    container_name: review-service
    ports:
      - "19098:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8080/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/review_db
      SPRING_DATASOURCE_USERNAME: javaauction
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - javaauction-network
    depends_on:
      eureka-server:
        condition: service_healthy

networks:
  javaauction-network:
    external: true
    name: javaauction-network
